name: Build Multi-Style MiniApp Templates

on:
  push:
    branches:
      - main
    paths:
      - 'apps/miniapp-generator/**'
      - '.github/workflows/build-templates.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/miniapp-generator/**'
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  PNPM_VERSION: '10'

jobs:
  build-templates:
    name: Build Template ${{ matrix.template_code }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - template_code: modern-general
            template_name: 现代综合医疗
          - template_code: premium-specialty
            template_name: 高端专科门诊
          - template_code: pediatric
            template_name: 亲子儿科
          - template_code: womens-health
            template_name: 女性健康
          - template_code: elderly-tcm
            template_name: 长辈友好中医康养

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build template ${{ matrix.template_code }}
        working-directory: apps/miniapp-generator
        env:
          TARO_APP_TEMPLATE_CODE: ${{ matrix.template_code }}
          CI: true
        run: |
          START_TIME=$(date +%s)
          echo "Building template: ${{ matrix.template_name }} (${{ matrix.template_code }})"
          node scripts/build-template.mjs --template ${{ matrix.template_code }}
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "Build completed in ${DURATION}s"

      - name: Verify build output
        working-directory: apps/miniapp-generator
        run: |
          FILE_COUNT=$(find dist -type f 2>/dev/null | wc -l)
          echo "Template ${{ matrix.template_code }} file count: $FILE_COUNT"
          if [ "$FILE_COUNT" -lt 200 ]; then
            echo "Error: Build output too small (expected >= 200 files, got $FILE_COUNT)"
            exit 1
          fi
          echo "Build output verified: $FILE_COUNT files"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: miniapp-template-${{ matrix.template_code }}
          path: apps/miniapp-generator/dist/
          retention-days: 7
          if-no-files-found: error

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: build-templates
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Generate build summary
        run: |
          echo "# 多风格小程序模板构建报告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 模板代码 | 模板名称 | 状态 | 文件数 |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|---------|------|--------|" >> $GITHUB_STEP_SUMMARY

          for template in modern-general premium-specialty pediatric womens-health elderly-tcm; do
            if [ -d "artifacts/miniapp-template-$template" ]; then
              count=$(find "artifacts/miniapp-template-$template" -type f | wc -l)
              echo "| $template | ✅ 成功 | $count |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $template | ❌ 失败 | - |" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Verify all builds succeeded
        run: |
          REQUIRED_TEMPLATES=("modern-general" "premium-specialty" "pediatric" "womens-health" "elderly-tcm")
          for template in "${REQUIRED_TEMPLATES[@]}"; do
            if [ ! -d "artifacts/miniapp-template-$template" ]; then
              echo "Error: Template $template build failed or artifact missing"
              exit 1
            fi
          done
          echo "All 5 templates built successfully"
