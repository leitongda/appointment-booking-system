line-length = 120

target-version = "py312"

exclude = [
    "migrations",
    "__pycache__",
    ".venv",
    "tests",
]

[lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM"]

ignore = [
    "B008",   # FastAPI Depends() in function arguments is standard pattern
    "S105",   # False positives for hardcoded passwords
    "S110",   # try-except-pass is sometimes intentional
    "S324",   # hashlib.sha1 required by WeChat API
    "S603",   # subprocess calls are controlled
    "S607",   # partial executable paths are intentional
    "S108",   # temp paths are intentional
]

[lint.per-file-ignores]
# tests 目录放宽规则
"tests/**/*.py" = ["S101", "S106", "B011", "SIM"]

[format]
quote-style = "double"
indent-style = "space"
