# 监控栈 — Prometheus + Grafana
# 使用方式:
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#
# Prometheus: http://localhost:9090
# Grafana:    http://localhost:3000  (default: admin / admin, 可通过 .env 覆盖)
# 后端 metrics: http://localhost:8000/metrics
#
# 注意: 此文件引用 monitoring/ 目录下的配置文件。
# 如果只需要监控栈（不含后端），可单独使用:
#   docker compose -f monitoring/docker-compose.monitoring.yml up -d

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: hospital_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.retention.size=2GB"
    networks:
      - hospital_net

  grafana:
    image: grafana/grafana:11.1.0
    container_name: hospital_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=grafana-clock-panel
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - hospital_net

  # Node Exporter — 主机指标（CPU/内存/磁盘/网络）
  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: hospital_node_exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
    networks:
      - hospital_net

  # Redis Exporter — Redis 指标
  redis-exporter:
    image: oliver006/redis_exporter:v1.61.0
    container_name: hospital_redis_exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis://host.docker.internal:6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - hospital_net

volumes:
  prometheus_data:
  grafana_data:

networks:
  hospital_net:
    external: true
