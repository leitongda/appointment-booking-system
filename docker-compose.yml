# 宝塔混合部署配置
# 数据库和 Redis 使用宝塔安装的服务，Docker 只运行后端应用

services:
  # FastAPI 后端
  backend:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    image: hospital_backend:latest
    container_name: hospital_backend
    restart: always
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /app/var:rw,size=64m,mode=1777
    environment:
      # 连接宝塔安装的 PostgreSQL（必须通过 .env 文件或环境变量设置）
      - DATABASE_URL=${DATABASE_URL:?请设置 DATABASE_URL 环境变量}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      # 连接宝塔安装的 Redis（必须通过 .env 文件或环境变量设置）
      - REDIS_URL=${REDIS_URL:?请设置 REDIS_URL 环境变量}
      - SECRET_KEY=${SECRET_KEY:?请设置 SECRET_KEY 环境变量}
      - DEBUG=false
      - ENVIRONMENT=production
      - STORAGE_TYPE=local
      - LOCAL_UPLOAD_DIR=/app/uploads
      # 知识库（RAG）：API 侧需要开关与 embedding 配置（检索时向量化查询）
      - KB_ENABLED=${KB_ENABLED:-false}
      - KB_EMBEDDING_PROVIDER=${KB_EMBEDDING_PROVIDER:-zhipu}
      - KB_EMBEDDING_MODEL=${KB_EMBEDDING_MODEL:-embedding-3}
      - KB_EMBEDDING_DIMS=${KB_EMBEDDING_DIMS:-1024}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY:-}
      - KB_MAX_FILE_MB=${KB_MAX_FILE_MB:-50}
      # 微信小程序配置
      - WECHAT_APP_ID=${WECHAT_APP_ID:-}
      - WECHAT_APP_SECRET=${WECHAT_APP_SECRET:-}
    ports:
      - "8000:8000"
      - "9001:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./apps/server/uploads:/app/uploads

  # Celery Worker - 处理异步任务
  celery_worker:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    image: hospital_backend:latest
    container_name: hospital_celery_worker
    restart: always
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /app/var:rw,size=64m,mode=1777
    environment:
      - DATABASE_URL=${DATABASE_URL:?请设置 DATABASE_URL 环境变量}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - REDIS_URL=${REDIS_URL:?请设置 REDIS_URL 环境变量}
      - SECRET_KEY=${SECRET_KEY:?请设置 SECRET_KEY 环境变量}
    command: celery -A app.celery_app worker -l info -c 4 -Q default,scheduled,notification
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping --timeout 5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Celery Worker（知识库）- 文档解析/向量化，独立 knowledge 队列、单并发
  # 与核心业务 worker 隔离：一份坏文档只拖慢知识库自己；--max-memory-per-child 兜底解析器内存泄漏（生产机 3.6G）
  celery_knowledge_worker:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    image: hospital_backend:latest
    container_name: hospital_celery_knowledge_worker
    restart: always
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /app/var:rw,size=64m,mode=1777
    environment:
      - DATABASE_URL=${DATABASE_URL:?请设置 DATABASE_URL 环境变量}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - REDIS_URL=${REDIS_URL:?请设置 REDIS_URL 环境变量}
      - SECRET_KEY=${SECRET_KEY:?请设置 SECRET_KEY 环境变量}
      - STORAGE_TYPE=local
      - LOCAL_UPLOAD_DIR=/app/uploads
      - KB_ENABLED=${KB_ENABLED:-false}
      - KB_EMBEDDING_PROVIDER=${KB_EMBEDDING_PROVIDER:-zhipu}
      - KB_EMBEDDING_MODEL=${KB_EMBEDDING_MODEL:-embedding-3}
      - KB_EMBEDDING_DIMS=${KB_EMBEDDING_DIMS:-1024}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY:-}
      - KB_MAX_FILE_MB=${KB_MAX_FILE_MB:-50}
      # 解析临时目录必须是磁盘卷（容器 /tmp 是 tmpfs，占内存）
      - KB_TMP_DIR=/app/kb-tmp
    command: >
      celery -A app.celery_app worker -l info -Q knowledge -c 1
      --max-tasks-per-child=20 --max-memory-per-child=400000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 原件只读；kb-tmp 宿主机目录需预先 mkdir -p && chmod 1777（容器以 appuser 运行）
      - ./apps/server/uploads:/app/uploads:ro
      - ./apps/server/var/kb-tmp:/app/kb-tmp
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping --timeout 5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Celery Beat - 定时任务调度器
  celery_beat:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    image: hospital_backend:latest
    container_name: hospital_celery_beat
    restart: always
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /app/var:rw,size=64m,mode=1777
    environment:
      # 只读根文件系统下 PersistentScheduler 的调度文件必须放到可写路径
      - CELERYBEAT_SCHEDULE_FILENAME=/tmp/celerybeat-schedule
      - DATABASE_URL=${DATABASE_URL:?请设置 DATABASE_URL 环境变量}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - REDIS_URL=${REDIS_URL:?请设置 REDIS_URL 环境变量}
      - SECRET_KEY=${SECRET_KEY:?请设置 SECRET_KEY 环境变量}
    command: celery -A app.celery_app beat -l info --pidfile=/tmp/celerybeat.pid
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # PID1 信号语义在容器内不可靠（kill -0 1 恒失败），改查 /proc 存在性
      test: ["CMD-SHELL", "test -d /proc/$(cat /tmp/celerybeat.pid)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Flower - Celery 监控工具
  celery_flower:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    image: hospital_backend:latest
    container_name: hospital_celery_flower
    restart: always
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /app/var:rw,size=64m,mode=1777
    environment:
      - DATABASE_URL=${DATABASE_URL:?请设置 DATABASE_URL 环境变量}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - REDIS_URL=${REDIS_URL:?请设置 REDIS_URL 环境变量}
      - SECRET_KEY=${SECRET_KEY:?请设置 SECRET_KEY 环境变量}
      - FLOWER_PORT=5555
      - FLOWER_BASIC_AUTH=${FLOWER_BASIC_AUTH:?请设置 FLOWER_BASIC_AUTH 环境变量}
    ports:
      - "5555:5555"
    command: celery -A app.celery_app flower --port=5555 --broker=${REDIS_URL} --basic_auth=${FLOWER_BASIC_AUTH}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # /api/workers 受 basic-auth 保护，未带凭据恒 401
      test: ["CMD-SHELL", "curl -sf -u \"$FLOWER_BASIC_AUTH\" http://localhost:5555/api/workers -o /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
