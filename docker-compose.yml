version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: hospital_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-hospital}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hospital123}
      POSTGRES_DB: ${DB_NAME:-hospital_booking}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docs/database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospital"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: hospital_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI 后端
  backend:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    container_name: hospital_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-hospital}:${DB_PASSWORD:-hospital123}@postgres:5432/${DB_NAME:-hospital_booking}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - DEBUG=${DEBUG:-false}
      - ENVIRONMENT=${ENVIRONMENT:-production}
    ports:
      - "8000:8000"
    volumes:
      - ./apps/server:/app

  # Celery Worker - 处理异步任务
  celery_worker:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    container_name: hospital_celery_worker
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-hospital}:${DB_PASSWORD:-hospital123}@postgres:5432/${DB_NAME:-hospital_booking}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
    command: celery -A app.celery_app worker -l info -c 4 -Q default,scheduled,notification
    volumes:
      - ./apps/server:/app
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Celery Beat - 定时任务调度器
  celery_beat:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    container_name: hospital_celery_beat
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-hospital}:${DB_PASSWORD:-hospital123}@postgres:5432/${DB_NAME:-hospital_booking}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
    command: celery -A app.celery_app beat -l info --pidfile=/tmp/celerybeat.pid
    volumes:
      - ./apps/server:/app
      - celery_beat_data:/tmp

  # Nginx 反向代理 (生产环境)
  nginx:
    image: nginx:alpine
    container_name: hospital_nginx
    restart: always
    depends_on:
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./apps/admin/dist:/usr/share/nginx/html/admin
      - ./apps/patient/dist:/usr/share/nginx/html/patient
      - ./apps/doctor/dist:/usr/share/nginx/html/doctor
    ports:
      - "80:80"
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:
  celery_beat_data:

networks:
  default:
    name: hospital_network
