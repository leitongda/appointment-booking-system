version: '3.8'

services:
  # FastAPI 后端
  backend:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    container_name: hospital_backend
    restart: always
    environment:
      # 连接宝塔安装的数据库（host.docker.internal 指向宿主机）
      - DATABASE_URL=postgresql+asyncpg://hospital:kfETyKGsLX6hNnWK@host.docker.internal:5432/hospital_booking
      - REDIS_URL=redis://host.docker.internal:6379/0
      - SECRET_KEY=${SECRET_KEY:-your-secret-key}
      - DEBUG=false
      - ENVIRONMENT=production
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Celery Worker
  celery_worker:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    container_name: hospital_celery_worker
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://hospital:kfETyKGsLX6hNnWK@host.docker.internal:5432/hospital_booking
      - REDIS_URL=redis://host.docker.internal:6379/0
      - SECRET_KEY=${SECRET_KEY:-your-secret-key}
    command: celery -A app.celery_app worker -l info -c 4 -Q default,scheduled,notification
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Celery Beat
  celery_beat:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    container_name: hospital_celery_beat
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://hospital:kfETyKGsLX6hNnWK@host.docker.internal:5432/hospital_booking
      - REDIS_URL=redis://host.docker.internal:6379/0
      - SECRET_KEY=${SECRET_KEY:-your-secret-key}
    command: celery -A app.celery_app beat -l info --pidfile=/tmp/celerybeat.pid
    extra_hosts:
      - "host.docker.internal:host-gateway"