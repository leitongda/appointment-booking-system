# 宝塔混合部署配置
# 数据库和 Redis 使用宝塔安装的服务，Docker 只运行后端应用

services:
  # FastAPI 后端
  backend:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    image: hospital_backend:latest
    container_name: hospital_backend
    restart: always
    environment:
      # 连接宝塔安装的 PostgreSQL
      - DATABASE_URL=postgresql+asyncpg://hospital:njESjyken4xihHit@host.docker.internal:5432/hospital_booking
      # 连接宝塔安装的 Redis
      - REDIS_URL=redis://host.docker.internal:6379/0
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - DEBUG=false
      - ENVIRONMENT=production
      - STORAGE_TYPE=local
      - LOCAL_UPLOAD_DIR=/app/uploads
      # 微信小程序配置
      - WECHAT_APP_ID=${WECHAT_APP_ID:-}
      - WECHAT_APP_SECRET=${WECHAT_APP_SECRET:-}
    ports:
      - "8000:8000"
      - "9001:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./apps/server/uploads:/app/uploads

  # Celery Worker - 处理异步任务
  celery_worker:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    image: hospital_backend:latest
    container_name: hospital_celery_worker
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://hospital:njESjyken4xihHit@host.docker.internal:5432/hospital_booking
      - REDIS_URL=redis://host.docker.internal:6379/0
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
    command: celery -A app.celery_app worker -l info -c 4 -Q default,scheduled,notification
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Celery Beat - 定时任务调度器
  celery_beat:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    image: hospital_backend:latest
    container_name: hospital_celery_beat
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://hospital:njESjyken4xihHit@host.docker.internal:5432/hospital_booking
      - REDIS_URL=redis://host.docker.internal:6379/0
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
    command: celery -A app.celery_app beat -l info --pidfile=/tmp/celerybeat.pid
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Flower - Celery 监控工具
  celery_flower:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    image: hospital_backend:latest
    container_name: hospital_celery_flower
    restart: always
    environment:
      - CELERY_BROKER_URL=redis://host.docker.internal:6379/0
      - FLOWER_PORT=5555
      - FLOWER_BASIC_AUTH=${FLOWER_BASIC_AUTH:-admin:admin123}
    ports:
      - "5555:5555"
    command: celery -A app.celery_app flower --port=5555 --broker=redis://host.docker.internal:6379/0 --basic_auth=${FLOWER_BASIC_AUTH:-admin:admin123}
    extra_hosts:
      - "host.docker.internal:host-gateway"
