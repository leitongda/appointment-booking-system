# Prometheus 抓取配置
# hospital backend 通过 starlette_exporter 或 prometheus_fastapi_instrumentator 暴露 /metrics

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # Prometheus 自我监控
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # FastAPI 后端 — 需安装 prometheus_fastapi_instrumentator
  - job_name: "hospital-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          service: "hospital-backend"
          environment: "production"

  # Node Exporter — 主机指标
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: "node-exporter"

  # Redis Exporter — Redis 指标
  - job_name: "redis-exporter"
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: "redis-exporter"
