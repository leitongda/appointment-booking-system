name: Desktop Release (Tauri)

# 桌面客户端打包：admin / doctor × macOS(universal: arm64+x64) / Windows(x64)。
# 触发：推 tag `desktop-v*`（如 desktop-v1.1.0）或手动触发。
# 产物：挂到同名 GitHub Release（草稿，人工审核后发布）。发布后运行
#   desktop-release/publish-updates.sh <tag>
# 把更新产物同步到生产 nginx 并按端生成 latest.json（自动更新源；国内机构直连 GitHub 不可靠）。
#
# Runner 策略（账户为 GitHub Free，私有仓库 macOS 托管 runner 按 10 倍计分且需预算）：
#   - prepare 与 macOS 打包跑在自托管 Mac（labels: self-hosted, macOS, desktop-mac），
#     不占额度不计费；该机需装好 rustup（含 aarch64/x86_64-apple-darwin 两个 target）与 Xcode CLT
#     （prepare 的版本/公告门禁只依赖 bash + python3，均随 CLT 自带）
#   - Windows 打包仍用 GitHub 托管 windows-latest（2 倍计分），免费额度耗尽时该作业会被拒，
#     fail-fast=false 保证不影响 macOS 产物；额度每月 1 日重置
#
# 版本：唯一来源是 apps/{admin,doctor}/package.json 的 version（tauri.conf.json 的 version 指向它，
#   两端锁步、同一 tag 同时发）。推 tag 时门禁断言 tag 版本号 == 两端 package.json，忘 bump 直接红，
#   不浪费打包时间。
# 公告：desktop-release/CHANGELOG.md 的 `## X.Y.Z` 段落 → Release 正文；publish 脚本再把同一段落写进
#   latest.json 的 notes，供应用内更新弹窗展示。段落缺失同样门禁失败（禁止空公告发版）。
#
# 必需 secrets（updater 已启用，缺一不可；prepare 阶段 fail-fast）：
#   TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD  更新包 minisign 签名（丢失=无法再推送更新）
#   DESKTOP_UPDATE_BASE_URL  更新源根地址（必须 https，如 https://yy.xxx.com；域名不入库），构建期用
#     `tauri build --config` 合并进 plugins.updater.endpoints，仓库内只留 .invalid 占位
# 可选 secrets（缺失时照常出未签名/未公证包）：
#   macOS：APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY /
#          APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID（Developer ID + 公证）
#
# Windows 只出 NSIS（tauri.conf.json bundle.targets 已去掉 msi）：避免机构混装两种安装器导致更新错位。
# Windows runner 不需额外依赖（WebView2 由安装包引导）。

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      app:
        description: '要打包的端（all / admin / doctor）'
        required: false
        default: 'all'

env:
  TAURI_DESKTOP: '1'

jobs:
  # 前置：① 必需 secrets 存在性；② 按触发方式算出要打包的端（动态矩阵）；③ 推 tag 时校验版本号、
  # 提取公告并建一次 Release 草稿，避免矩阵作业并发各自建 Release 产生竞争。
  # 手动触发不建 Release，产物走 artifact。
  prepare:
    runs-on: [self-hosted, macOS, desktop-mac]
    permissions:
      contents: write
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
      release_id: ${{ steps.release.outputs.result }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Require updater secrets
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATE_BASE_URL: ${{ secrets.DESKTOP_UPDATE_BASE_URL }}
        run: |
          fail=0
          [ -n "$SIGNING_KEY" ] || { echo "::error::缺少 secret TAURI_SIGNING_PRIVATE_KEY（updater 已启用，无私钥无法签名更新包）"; fail=1; }
          [ -n "$UPDATE_BASE_URL" ] || { echo "::error::缺少 secret DESKTOP_UPDATE_BASE_URL（更新源根地址，如 https://yy.xxx.com）"; fail=1; }
          case "$UPDATE_BASE_URL" in
            ''|https://*) ;;
            *) echo "::error::DESKTOP_UPDATE_BASE_URL 必须是 https（Tauri updater 生产态强制 TLS）"; fail=1 ;;
          esac
          exit $fail

      - name: Resolve apps to build
        id: apps
        run: |
          case "${{ github.event.inputs.app || 'all' }}" in
            admin)  echo 'apps=["admin"]' >> "$GITHUB_OUTPUT" ;;
            doctor) echo 'apps=["doctor"]' >> "$GITHUB_OUTPUT" ;;
            *)      echo 'apps=["admin","doctor"]' >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Verify tag matches package.json versions
        if: ${{ github.event_name == 'push' }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#desktop-v}"
          # 允许 -rcN 后缀：desktop-v1.1.0-rc1 对应 package.json 的 1.1.0
          case "$version" in *-rc[0-9]*) version="${version%%-*}" ;; esac
          fail=0
          for app in admin doctor; do
            pkg_version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "apps/${app}/package.json")"
            if [ "$pkg_version" != "$version" ]; then
              echo "::error file=apps/${app}/package.json::tag ${tag} 对应版本 ${version}，但 apps/${app}/package.json 是 ${pkg_version}——先 bump 再打 tag"
              fail=1
            fi
          done
          exit $fail

      - name: Extract release notes from CHANGELOG
        id: notes
        if: ${{ github.event_name == 'push' }}
        run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          case "$version" in *-rc[0-9]*) version="${version%%-*}" ;; esac
          desktop-release/extract-notes.sh "$version" > "$RUNNER_TEMP/notes.md"
          {
            echo "notes<<__DESKTOP_NOTES__"
            cat "$RUNNER_TEMP/notes.md"
            echo "__DESKTOP_NOTES__"
          } >> "$GITHUB_OUTPUT"

      - name: Create draft release
        id: release
        if: ${{ github.event_name == 'push' }}
        uses: actions/github-script@v7
        env:
          NOTES: ${{ steps.notes.outputs.notes }}
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const body = [
              process.env.NOTES.trim(),
              '',
              '---',
              '桌面客户端（Tauri 2）。HospitalAdmin：机构管理端；HospitalDoctor：医生端。',
              '首次安装后在应用数据目录创建 desktop-config.json 指向机构后端：',
              '`{"desktop.baseUrl": "http://<server>:9000/api/v1"}`',
              '已安装 v1.1.0 及以上的客户端会在启动时自动提示更新（发布后需运行 desktop-release/publish-updates.sh 同步到更新源）。',
            ].join('\n');
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Desktop ${tag}`,
              body,
              draft: true,
              prerelease: false,
            });
            return data.id;

  build:
    needs: [prepare]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.prepare.outputs.apps) }}
        platform:
          - name: macos-universal
            os: [self-hosted, macOS, desktop-mac]
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: '--target universal-apple-darwin'
          - name: windows-x64
            os: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            args: ''
    runs-on: ${{ matrix.platform.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        # 版本从根 package.json 的 packageManager（pnpm@10.x）读取；lockfile 为 v9，pnpm 8 无法解析
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.rust_targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/${{ matrix.app }}/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Inject updater endpoint (config overlay)
        # 真实更新源域名不入库：生成 tauri.ci.conf.json 覆盖层，由 `tauri build --config` 深合并进 tauri.conf.json。
        # 每个端一份 latest.json：<BASE>/desktop/updates/<admin|doctor>/latest.json（与 publish-updates.sh 的布局一致）。
        shell: bash
        env:
          UPDATE_BASE_URL: ${{ secrets.DESKTOP_UPDATE_BASE_URL }}
        run: |
          base="${UPDATE_BASE_URL%/}"
          cat > "apps/${{ matrix.app }}/src-tauri/tauri.ci.conf.json" <<EOF
          {
            "plugins": {
              "updater": {
                "endpoints": ["${base}/desktop/updates/${{ matrix.app }}/latest.json"]
              }
            }
          }
          EOF
          cat "apps/${{ matrix.app }}/src-tauri/tauri.ci.conf.json"

      - name: Configure macOS signing (only when secrets are set)
        # Tauri 只要看到 APPLE_CERTIFICATE 变量存在（即使为空）就会执行 security import，
        # 空值会让打包在 codesign 阶段失败；因此仅在 secret 非空时才写入环境，缺省出未签名包。
        if: ${{ runner.os == 'macOS' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              printf '%s=%s\n' "$v" "${!v}" >> "$GITHUB_ENV"
            done
            echo "macOS 签名/公证已启用"
          else
            echo "未配置 APPLE_CERTIFICATE，产出未签名包"
          fi

      - name: Build desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 更新包签名（minisign；prepare 已门禁保证非空）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/${{ matrix.app }}
          # 仓库没有名为 tauri 的 npm script；显式用 pnpm 调用 @tauri-apps/cli（默认 npm run tauri 会 Missing script）
          tauriScript: pnpm tauri
          # 推 tag 时上传到 create-release 预建的草稿；手动触发（分支）不碰 Release，产物走 artifact
          releaseId: ${{ needs.prepare.outputs.release_id }}
          # 两端共用一个 Release，tauri-action 的单份 latest.json 会按平台键互相覆盖，且 universal 包
          # 需同时登记 darwin-aarch64/darwin-x86_64——关掉，改由 publish-updates.sh 按端各生成一份
          # （同时把下载地址改写到生产 nginx）
          includeUpdaterJson: false
          args: ${{ matrix.platform.args }} --config ${{ github.workspace }}/apps/${{ matrix.app }}/src-tauri/tauri.ci.conf.json

      - name: Upload bundles as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-${{ matrix.platform.name }}
          path: |
            apps/${{ matrix.app }}/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/${{ matrix.app }}/src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            apps/${{ matrix.app }}/src-tauri/target/**/release/bundle/macos/*.app.tar.gz.sig
            apps/${{ matrix.app }}/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/${{ matrix.app }}/src-tauri/target/**/release/bundle/nsis/*.exe.sig
          if-no-files-found: warn
          retention-days: 14
