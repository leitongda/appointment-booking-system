name: Prod Ops (self-hosted)

# 生产运维（自托管 Mac runner 执行；托管 runner 受账户额度限制时的替代通道）。
# 凭据只存在仓库 secrets（CVM_HOST / CVM_USERNAME / CVM_SSH_KEY / CVM_PORT），不落本地。
# 与 build-server.yml 的差异：不用 Docker 版 ssh-action（macOS runner 跑不了），用原生 ssh/scp；
# deploy-server 只重建 backend 服务，不做全栈 down（避免 15 分钟停机）。
#
# action：
#   inspect          只读巡检：代码版本、容器状态、compose 挂载、nginx 站点配置路径、磁盘内存
#   deploy-server    服务器拉 origin/main（fetch 超时则 scp 同步 apps/server/app）→ compose build+up backend
#   deploy-frontend  在 runner 构建 admin/doctor web 产物 → scp 到服务器静态目录
#   publish-updates  跑 desktop-release/publish-updates.sh 把桌面端更新产物发布到生产 nginx

on:
  workflow_dispatch:
    inputs:
      action:
        description: '要执行的动作'
        required: true
        type: choice
        options: [inspect, deploy-server, deploy-frontend, publish-updates]
        default: inspect
      tag:
        description: 'publish-updates 用：Release tag（如 desktop-v1.1.0-rc1）'
        required: false
        default: ''
      frontend_target_dir:
        description: 'deploy-frontend 用：服务器静态根（默认 /www/wwwroot/hospital-web，实际为 <根>/<app>）'
        required: false
        default: '/www/wwwroot/hospital-web'
      updates_remote_dir:
        description: 'publish-updates 用：服务器更新源目录（默认 /www/wwwroot/hospital-web/desktop/updates）'
        required: false
        default: ''

env:
  PROJECT_DIR: /www/wwwroot/appointment-booking-system  # inspect 实测：compose 项目在此（build-server.yml 里的 /www/hospital-booking 不存在）

jobs:
  ops:
    runs-on: [self-hosted, macOS, desktop-mac]
    permissions:
      # publish-updates 需读取草稿 Release 的产物（草稿对只读 token 不可见）
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Prepare SSH
        env:
          CVM_SSH_KEY: ${{ secrets.CVM_SSH_KEY }}
          CVM_HOST: ${{ secrets.CVM_HOST }}
          CVM_USERNAME: ${{ secrets.CVM_USERNAME }}
          CVM_PORT: ${{ secrets.CVM_PORT }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/cvm_key"
          printf '%s\n' "$CVM_SSH_KEY" > "$key"
          chmod 600 "$key"
          port="${CVM_PORT:-22}"
          {
            echo "SSH_KEY=$key"
            echo "SSH_PORT=$port"
            echo "SSH_DEST=${CVM_USERNAME}@${CVM_HOST}"
            echo "SSH_OPTS=-i $key -p $port -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new"
          } >> "$GITHUB_ENV"
          echo "SSH 目标: ${CVM_USERNAME}@${CVM_HOST}:${port}"

      - name: Inspect (read-only)
        if: ${{ inputs.action == 'inspect' }}
        run: |
          set -uo pipefail
          ssh $SSH_OPTS "$SSH_DEST" bash -s <<'REMOTE'
            set -u
            echo "===== 主机 ====="; hostname; uname -m; uptime
            echo "===== 磁盘/内存 ====="; df -h / 2>/dev/null | tail -1; free -m 2>/dev/null | sed -n '2p'
            echo "===== compose 项目（docker compose ls）====="; docker compose ls -a 2>/dev/null || echo "(docker compose ls 不可用)"
            echo "===== 运行中的容器 ====="; docker ps --format '{{.Names}}\t{{.Status}}\t{{.Image}}' 2>/dev/null
            echo "===== 容器工作目录标签（compose project 目录）====="; docker inspect $(docker ps -q 2>/dev/null) --format '{{index .Config.Labels "com.docker.compose.project.working_dir"}}' 2>/dev/null | sort -u
            echo "===== 候选项目目录 ====="; for d in /www/wwwroot/* /www/* /root/* /home/*/* /opt/* /srv/*; do [ -f "$d/docker-compose.yml" ] && echo "$d  ($(cd "$d" && git log -1 --format='%h %s' 2>/dev/null | cut -c1-60))"; done 2>/dev/null
            echo "===== backend 容器内代码版本（CORS/医生登录是否已含修复）====="
            c=$(docker ps --format '{{.Names}}' 2>/dev/null | grep -iE "backend|server|api" | head -1); echo "容器: ${c:-无}"
            [ -n "$c" ] && docker exec "$c" sh -c 'grep -c "tauri://localhost" app/core/config.py 2>/dev/null; grep -c "by_alias=True" app/modules/doctors/router.py 2>/dev/null' 2>/dev/null | paste -sd' ' | sed 's/^/tauri_origin_count by_alias_count: /'
            echo "===== nginx 站点配置 ====="; for f in /www/server/panel/vhost/nginx/*.conf; do grep -q "yy.aicm.online" "$f" 2>/dev/null && { echo "--- $f"; grep -nE "^\s*(root|location|proxy_pass|alias)" "$f" | head -24; }; done
            echo "===== 静态目录 ====="; ls -d /www/wwwroot/*/ 2>/dev/null; echo "-- hospital-web:"; ls /www/wwwroot/hospital-web/ 2>/dev/null; for a in admin doctor; do p=/www/wwwroot/hospital-web/$a; [ -f "$p/index.html" ] && echo "$a: $(stat -c '%y' $p/index.html | cut -c1-16)  $(ls $p | wc -l) files"; done
            echo "===== desktop/updates 现状 ====="; ls -R /www/wwwroot/hospital-web/desktop 2>/dev/null | head -8 || echo "无"
          REMOTE

      - name: Deploy server (backend only)
        if: ${{ inputs.action == 'deploy-server' }}
        run: |
          set -euo pipefail
          # 服务器上 git 走 GitHub 常卡死（历史经验），fetch 加超时；失败则从 runner 的 main 检出直接 scp 同步代码
          if ssh $SSH_OPTS "$SSH_DEST" "cd $PROJECT_DIR && timeout 180 git fetch origin main && git reset --hard origin/main && git log -1 --oneline"; then
            echo "服务器已同步到 origin/main"
          else
            echo "git fetch 失败/超时，改为 scp 同步 apps/server/app"
            ssh $SSH_OPTS "$SSH_DEST" "mkdir -p $PROJECT_DIR/apps/server"
            scp -i "$SSH_KEY" -P "$SSH_PORT" -o StrictHostKeyChecking=accept-new -rq apps/server/app "$SSH_DEST:$PROJECT_DIR/apps/server/"
          fi
          ssh $SSH_OPTS "$SSH_DEST" bash -s <<'REMOTE'
            set -euo pipefail
            cd /www/wwwroot/appointment-booking-system
            echo "--- 构建并重建 backend（其余服务不动）---"
            docker compose build backend
            docker compose up -d --no-deps backend
            sleep 8
            docker compose ps backend
            echo "--- 健康探测 ---"
            curl -s -o /dev/null -w "public-key -> HTTP %{http_code}\n" --max-time 10 http://127.0.0.1:8000/api/v1/admin/public-key || true
            curl -s -i -X OPTIONS http://127.0.0.1:8000/api/v1/admin/public-key -H "Origin: tauri://localhost" -H "Access-Control-Request-Method: GET" --max-time 10 | grep -iE "^HTTP|allow-origin" || true
            docker image prune -f >/dev/null 2>&1 || true
          REMOTE

      - name: Setup pnpm
        if: ${{ inputs.action == 'deploy-frontend' || inputs.action == 'publish-updates' }}
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: ${{ inputs.action == 'deploy-frontend' }}
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Deploy frontend (admin + doctor web)
        if: ${{ inputs.action == 'deploy-frontend' }}
        env:
          TARGET_DIR: ${{ inputs.frontend_target_dir }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @hospital/admin run build
          pnpm --filter @hospital/doctor run build
          for app in admin doctor; do
            dest="${TARGET_DIR:-/www/wwwroot/hospital-web}/$app"
            echo "--- 上传 $app → $dest ---"
            ssh $SSH_OPTS "$SSH_DEST" "mkdir -p '$dest.new' && rm -rf '$dest.new'/*"
            scp -i "$SSH_KEY" -P "$SSH_PORT" -o StrictHostKeyChecking=accept-new -rq apps/$app/dist/. "$SSH_DEST:$dest.new/"
            # 原子切换：保留上一版为 .bak 便于回滚
            ssh $SSH_OPTS "$SSH_DEST" "rm -rf '$dest.bak'; [ -d '$dest' ] && mv '$dest' '$dest.bak'; mv '$dest.new' '$dest'; ls '$dest' | head -3"
          done

      - name: Ensure nginx serves /desktop/updates/ (idempotent)
        if: ${{ inputs.action == 'publish-updates' }}
        env:
          REMOTE_DIR: ${{ inputs.updates_remote_dir }}
        run: |
          set -euo pipefail
          remote_dir="${REMOTE_DIR:-/www/wwwroot/hospital-web/desktop/updates}"
          ssh $SSH_OPTS "$SSH_DEST" "REMOTE_DIR='$remote_dir' bash -s" <<'REMOTE'
          set -euo pipefail
          conf=/www/server/panel/vhost/nginx/html_yy.aicm.online.conf
          mkdir -p "$REMOTE_DIR/admin" "$REMOTE_DIR/doctor"
          if grep -q "location /desktop/updates/" "$conf"; then echo "nginx 已有 /desktop/updates/ location，跳过"; exit 0; fi
          cp -a "$conf" "$conf.bak-desktop-updates-$(date +%Y%m%d%H%M%S)"
          block=$(mktemp)
          # 更新源用独立目录（alias），不随前端 dist 原子切换挪动；latest.json 禁缓存。插在 /api/ 反代之前。
          cat > "$block" <<EOF
              # 桌面客户端自动更新源（desktop-release/publish-updates.sh 发布）
              location ~ ^/desktop/updates/(admin|doctor)/latest\.json\$ {
                  alias $REMOTE_DIR/\$1/latest.json;
                  add_header Cache-Control "no-cache";
              }
              location /desktop/updates/ {
                  alias $REMOTE_DIR/;
                  autoindex off;
              }

          EOF
          awk -v f="$block" '/^[[:space:]]*location \/api\/ \{/ && !done { while ((getline l < f) > 0) print l; done=1 } { print }' "$conf" > "$conf.new"
          grep -q "location /desktop/updates/" "$conf.new" || { echo "::error::未找到 location /api/ 插入点"; rm -f "$conf.new"; exit 1; }
          mv "$conf.new" "$conf"
          nginx_bin=$(command -v nginx || echo /www/server/nginx/sbin/nginx)
          "$nginx_bin" -t
          "$nginx_bin" -s reload
          echo "nginx 已加入 /desktop/updates/ 并 reload"
          REMOTE

      - name: Publish desktop updates
        if: ${{ inputs.action == 'publish-updates' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DESKTOP_UPDATE_BASE_URL: ${{ secrets.DESKTOP_UPDATE_BASE_URL }}
          TAG: ${{ inputs.tag }}
          REMOTE_DIR: ${{ inputs.updates_remote_dir }}
        run: |
          set -euo pipefail
          [ -n "$TAG" ] || { echo "::error::publish-updates 需要 tag 输入"; exit 1; }
          # publish-updates.sh 按名字直接调 ssh/scp，不接受密钥参数；用作业内 PATH 前置的包装器注入密钥与端口
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/ssh" <<WRAP
          #!/bin/bash
          exec /usr/bin/ssh -i "$SSH_KEY" -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new "\$@"
          WRAP
          cat > "$RUNNER_TEMP/bin/scp" <<WRAP
          #!/bin/bash
          exec /usr/bin/scp -i "$SSH_KEY" -P "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new "\$@"
          WRAP
          chmod +x "$RUNNER_TEMP/bin/ssh" "$RUNNER_TEMP/bin/scp"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          export DESKTOP_UPDATE_SSH="$SSH_DEST"
          export DESKTOP_UPDATE_REMOTE_DIR="${REMOTE_DIR:-/www/wwwroot/hospital-web/desktop/updates}"
          chmod +x desktop-release/*.sh
          desktop-release/publish-updates.sh "$TAG"
