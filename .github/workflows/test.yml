name: Tests

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'apps/server/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'apps/server/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: apps/server/requirements.txt

      - name: Install dependencies
        working-directory: apps/server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        working-directory: apps/server
        run: |
          pytest tests/unit -v --tb=short -m unit || pytest tests/unit -v --tb=short
        continue-on-error: false

      - name: Run integration tests (SQLite in-memory)
        working-directory: apps/server
        run: |
          pytest tests/integration -v --tb=short -m integration || pytest tests/integration -v --tb=short
        continue-on-error: false

      - name: Run PostgreSQL integration tests
        working-directory: apps/server
        env:
          TEST_DATABASE_URL: "postgresql+asyncpg://test:test@localhost:5433/test_db"
        run: |
          pytest tests/integration/test_alembic_migration.py -v --tb=short --conftest=tests/conftest_pg.py
        continue-on-error: false

      - name: Architecture fitness functions (import-linter)
        working-directory: apps/server
        run: |
          pip install import-linter
          lint-imports --no-cache

      - name: Architecture fitness tests
        working-directory: apps/server
        run: |
          pytest tests/architecture/ -v --tb=short

      - name: Generate test report
        if: always()
        working-directory: apps/server
        run: |
          echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tests completed at: $(date)" >> $GITHUB_STEP_SUMMARY

  # 可选：代码质量检查
  lint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: apps/server/requirements.txt

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff flake8

      - name: Run Ruff
        working-directory: apps/server
        run: |
          ruff check . --output-format=github
        continue-on-error: false

      - name: Run Ruff Format Check
        working-directory: apps/server
        run: |
          ruff format --check .
        continue-on-error: false

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: apps/server/requirements.txt

      - name: Install dependencies and pip-audit
        working-directory: apps/server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: Run pip-audit
        working-directory: apps/server
        run: |
          pip-audit -r requirements.txt --desc on
        continue-on-error: false
