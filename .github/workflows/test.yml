name: Tests

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'apps/server/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'apps/server/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        # 知识库向量列依赖 pgvector；镜像版本对齐生产 PG 18（宝塔源码编译 18.0 + pgvector 0.8.7）
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: apps/server/requirements.txt

      - name: Install dependencies
        working-directory: apps/server
        run: |
          python -m pip install --upgrade pip
          # 装 dev 依赖（含 pytest-cov/pytest-asyncio），CI 需要覆盖率工具
          pip install -r requirements-dev.txt

      - name: Run unit tests with coverage (report-only, no gate)
        working-directory: apps/server
        run: |
          # 覆盖率门禁分两步走：本次仅报告（不设 --cov-fail-under）
          # 待跑出真实基线后，下迭代设 --cov-fail-under=<基线-5> 作为防回退门禁
          # 注意：不做失败重跑（|| pytest），flaky 必须暴露而不是被二次运行掩盖
          pytest tests/unit \
            -v --tb=short \
            --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml
        continue-on-error: false

      - name: Run tenant isolation matrix
        working-directory: apps/server
        run: |
          # 租户隔离矩阵：覆盖跨租户列表/详情/写拒绝与 fail-close 行为
          pytest tests/security tests/tenants -m multi_tenant -q
        continue-on-error: false

      - name: Permission catalog drift check
        working-directory: apps/server
        run: |
          # 权限目录漂移门禁：后端守卫新增权限码而未登记 init_permissions.py
          # 会导致该码无法授权（非 * 角色永远拿不到），漂移即失败
          python scripts/gen_permission_matrix.py --check
        continue-on-error: false

      - name: Run integration tests on PostgreSQL
        working-directory: apps/server
        env:
          TEST_DATABASE_URL: "postgresql+asyncpg://test:test@localhost:5433/test_db"
        run: |
          # 集成测试跑真实 PG，覆盖 JSONB/ILIKE/on_conflict 等 SQLite 测不到的路径
          # alembic 迁移测试单独一步执行（它自管 schema，混跑会与 create_all/drop_all 冲突）
          pytest tests/integration \
            --ignore=tests/integration/test_alembic_migration.py \
            -v --tb=short
        continue-on-error: false

      - name: Run tenant isolation matrix on PostgreSQL
        working-directory: apps/server
        env:
          TEST_DATABASE_URL: "postgresql+asyncpg://test:test@localhost:5433/test_db"
        run: |
          # 同一矩阵在 PG 上再跑一遍，防 SQLite/PG 方言差异
          pytest tests/security tests/tenants -m multi_tenant -q
        continue-on-error: false

      - name: Run Alembic migration tests on PostgreSQL
        working-directory: apps/server
        env:
          TEST_DATABASE_URL: "postgresql+asyncpg://test:test@localhost:5433/test_db"
        run: |
          pytest tests/integration/test_alembic_migration.py -v --tb=short
        continue-on-error: false

      - name: Architecture fitness functions (import-linter)
        working-directory: apps/server
        run: |
          pip install import-linter
          lint-imports --no-cache

      - name: Architecture fitness tests
        working-directory: apps/server
        run: |
          pytest tests/architecture/ -v --tb=short

      - name: Document contract check (README/CLAUDE.md vs code)
        working-directory: apps/server
        run: |
          # 校验 README.md / CLAUDE.md 中的路由数、模型数等关键数字与代码一致
          # 防止文档与实现脱节（历史曾出现 CLAUDE.md 同文件内 82/81 自相矛盾）
          python ../../scripts/check-doc-contracts.py

      - name: Generate test report
        if: always()
        working-directory: apps/server
        run: |
          echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tests completed at: $(date)" >> $GITHUB_STEP_SUMMARY

      - name: Publish coverage report
        if: always()
        working-directory: apps/server
        run: |
          echo "## 📊 Coverage Report (report-only, no gate)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 当前为「先报告后门禁」阶段：仅展示覆盖率，不阻断 PR。" >> $GITHUB_STEP_SUMMARY
          echo "> 下迭代将根据本基线设 \`--cov-fail-under\` 防回退门禁。" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage.xml ]; then
            # 提取行覆盖与分支覆盖（从 coverage.xml 的 <coverage> 根节点属性）
            python -c "
            import xml.etree.ElementTree as ET
            try:
                root = ET.parse('coverage.xml').getroot()
                lc = root.attrib.get('line-rate', '?')
                bc = root.attrib.get('branch-rate', '?')
                print(f'| 指标 | 比率 |')
                print(f'|------|------|')
                print(f'| 行覆盖 (line-rate) | {float(lc)*100:.1f}% |' if lc != '?' else f'| 行覆盖 | 无数据 |')
                print(f'| 分支覆盖 (branch-rate) | {float(bc)*100:.1f}% |' if bc != '?' else f'| 分支覆盖 | 无数据 |')
                print()
                print('完整明细见 artifact: \`coverage.xml\`')
            except Exception as e:
                print(f'_解析 coverage.xml 失败: {e}_')
            " >> $GITHUB_STEP_SUMMARY
          else
            echo "_coverage.xml 未生成（可能测试步骤失败）_" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: apps/server/coverage.xml
          retention-days: 14

  # 可选：代码质量检查
  lint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: apps/server/requirements.txt

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff flake8

      - name: Run Ruff
        working-directory: apps/server
        run: |
          ruff check . --output-format=github
        continue-on-error: false

      - name: Run Ruff Format Check
        working-directory: apps/server
        run: |
          ruff format --check .
        continue-on-error: false

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: apps/server/requirements.txt

      - name: Install dependencies and pip-audit
        working-directory: apps/server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: Run pip-audit
        working-directory: apps/server
        run: |
          pip-audit -r requirements.txt --desc on
        continue-on-error: false
