name: Deploy Server

on:
  push:
    branches:
      - main
    paths:
      - 'apps/server/**'
      - 'docker-compose.yml'
  workflow_dispatch:

env:
  PROJECT_DIR: /www/hospital-booking

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Deploy to Tencent Cloud CVM
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CVM_HOST }}
          username: ${{ secrets.CVM_USERNAME }}
          key: ${{ secrets.CVM_SSH_KEY }}
          port: ${{ secrets.CVM_PORT || 22 }}
          script: |
            # 进入项目目录
            cd ${{ env.PROJECT_DIR }}

            # 拉取最新代码
            git fetch origin main
            git reset --hard origin/main

            # 重新生成 llms 文档（确保与 API 同步）
            cd apps/server
            python scripts/generate_llms_txt.py
            cd ../..

            # 停止旧容器并构建新镜像启动
            docker compose down
            docker compose up -d --build

            # 清理未使用的镜像（可选，释放磁盘空间）
            docker image prune -f

            # 输出部署状态
            echo "✅ Server 部署完成！"
            docker compose ps

